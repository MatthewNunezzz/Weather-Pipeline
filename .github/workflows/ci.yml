name: CI

on:
  pull_request:
  push:

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff

      - name: Check for critical Python errors
        run: ruff check .

      - name: Identify Python formatting issues
        run: ruff format --check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  dbt-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weather_dbt_project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: weather_dbt_project/requirements-dbt.txt
      - run: pip install -r requirements-dbt.txt
      - run: dbt deps --profiles-dir .
      - run: dbt parse --profiles-dir ci